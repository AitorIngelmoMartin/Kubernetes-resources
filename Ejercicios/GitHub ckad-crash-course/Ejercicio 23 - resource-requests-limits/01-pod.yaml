# k run hello-world --image=bmuschko/nodejs-hello-world:1.0.0 --port=3000
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: hello-world
  name: hello-world
spec:
  containers:
  - image: bmuschko/nodejs-hello-world:1.0.0
    name: hello-world
    resources:
      requests:
        cpu: 100m
        memory: 500Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 500Mi
        ephemeral-storage: 2Gi
    ports:
    - containerPort: 3000
      protocol: TCP
    volumeMounts:
    - name: volume
      mountPath: /var/log
  - name: volume
    emptyDir: {}