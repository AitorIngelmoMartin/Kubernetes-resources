apiVersion: v1
kind: Pod
metadata:
  labels:
    run: pod-with-more-cpu-resource-requirements
  name: pod-with-more-cpu-resource-requirements
  namespace: d92
spec:
  containers:
  - image: nginx:1.23.4-alpine
    name: pod-with-more-cpu-resource-requirements
    resources:
      limits:
        cpu: 1.5
      requests:
        cpu: 400m
    volumeMounts:
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access-xpw6g
      readOnly: true
status:
  phase: Pending
  qosClass: Burstable

