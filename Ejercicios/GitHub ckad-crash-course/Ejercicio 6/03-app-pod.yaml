#  k run app --image=nginx:1.21.6
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: app
  name: app
spec:
  volumes:
    - name: config-volume
      persistentVolumeClaim:
        claimName: pvc
  containers:
  - image: nginx:1.21.6
    name: app
    volumeMounts:
      - mountPath: /var/app/config
        name: config-volume
  restartPolicy: Always