# k run adapter --image=busybox:1.36.1 --dry-run=client -o yaml > 01-adapter.yaml --command -- sh -c 'while true; do echo "$(date) | $(du -sh ~)" >> /var/logs/diskspace.txt; sleep 5; done;'
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: adapter
  name: adapter
  namespace: h92
spec:
  containers:
  - image: busybox:1.36.1
    name: transformer
    volumeMounts:
      - name: logs-volume
        mountPath: /var/logs
    command:
    - sh
    - -c
    - sleep 20; while true; do while read LINE; do echo "$LINE" | cut -f2 -d"|" >> $(date +%Y-%m-%d-%H-%M-%S)-transformed.txt; done < /var/logs/diskspace.txt; sleep 20; done; 
  - command:
    - sh
    - -c
    - while true; do echo "$(date) | $(du -sh ~)" >> /var/logs/diskspace.txt; sleep
      5; done;
    image: busybox:1.36.1
    name: app
    volumeMounts:
      - name: logs-volume
        mountPath: /var/logs
  volumes:
    - name: logs-volume
      emptyDir: {}